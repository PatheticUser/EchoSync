<title>EchoSync Architecture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  :root {
    --bg:        #0A0E1A;
    --surface:   #111827;
    --elevated:  #1E293B;
    --border:    #243044;
    --muted:     #475569;
    --text-dim:  #94A3B8;
    --text:      #CBD5E1;
    --text-hi:   #F1F5F9;
    --accent:    #38BDF8;
    --accent2:   #818CF8;
    --flow:      #10B981;
    --warn:      #F59E0B;

    --node-client:   #0F2942;
    --node-gateway:  #0F2330;
    --node-vad:      #0A2318;
    --node-stt:      #0A2318;
    --node-llm:      #1A1040;
    --node-tts:      #0A2318;
    --node-ext:      #1A1428;
    --node-obs:      #1F1A08;

    --node-border-client:  #1D5A8A;
    --node-border-gateway: #1B4D6E;
    --node-border-vad:     #166534;
    --node-border-stt:     #1B5E40;
    --node-border-llm:     #4338CA;
    --node-border-tts:     #1B5E40;
    --node-border-ext:     #4A2570;
    --node-border-obs:     #785E10;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }

  /* ── Layout ── */
  #shell {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  #topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  #topbar .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  #topbar .sep { flex: 1; }
  #topbar .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    letter-spacing: 0.05em;
  }

  #workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* ── Canvas ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
  }
  #canvas-wrap.panning { cursor: grabbing; }

  #canvas {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  /* ── Detail Panel ── */
  #panel {
    width: 320px;
    flex: none;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateX(100%);
    transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  #panel.open { transform: translateX(0); }

  #panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  #panel-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex: none;
  }
  #panel-title { font-weight: 600; font-size: 13px; color: var(--text-hi); }
  #panel-subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  #panel-close {
    margin-left: auto;
    background: none; border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
  }
  #panel-close:hover { color: var(--text); background: var(--elevated); }

  #panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #panel-body::-webkit-scrollbar { width: 4px; }
  #panel-body::-webkit-scrollbar-track { background: transparent; }
  #panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .p-section { display: flex; flex-direction: column; gap: 8px; }
  .p-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .p-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
  }
  .p-chip .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .p-chip .dot.green { background: var(--flow); }
  .p-chip .dot.purple { background: var(--accent2); }
  .p-chip .dot.amber { background: var(--warn); }
  .p-chips { display: flex; flex-wrap: wrap; gap: 5px; }

  .p-kv { display: flex; flex-direction: column; gap: 4px; }
  .p-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 11px;
  }
  .p-row .k { color: var(--text-dim); flex: none; min-width: 90px; }
  .p-row .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text);
    word-break: break-all;
  }
  .p-row .v.hi { color: var(--accent); }

  .p-divider { height: 1px; background: var(--border); }

  .p-prose {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .p-path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    word-break: break-all;
  }

  /* ── Bottom bar ── */
  #bottombar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    height: 44px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 10;
  }

  .bb-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .step-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .step-btn:hover { border-color: var(--accent); color: var(--accent); }
  .step-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.08); }

  .sep-v { width: 1px; height: 20px; background: var(--border); flex: none; }

  #step-track {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #step-track::-webkit-scrollbar { display: none; }

  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    cursor: pointer;
    flex: none;
    transition: all 0.15s;
  }
  .step-dot.active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 6px rgba(56,189,248,0.6);
  }
  .step-dot.done { background: var(--flow); border-color: var(--flow); }

  .zoom-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.12s;
  }
  .zoom-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── SVG Node Styles ── */
  .node-group { cursor: pointer; }
  .node-group:hover .node-rect { filter: brightness(1.15); }
  .node-group:hover .node-border { opacity: 1; }

  .node-rect { transition: filter 0.15s; }
  .node-border { opacity: 0.5; transition: opacity 0.15s; }

  .node-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    fill: #F1F5F9;
    pointer-events: none;
  }
  .node-sublabel {
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    fill: #94A3B8;
    pointer-events: none;
  }
  .node-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    fill: #38BDF8;
    pointer-events: none;
  }

  .edge { fill: none; stroke-linecap: round; }
  .edge-primary { stroke: #10B981; stroke-width: 1.8; }
  .edge-secondary { stroke: #334155; stroke-width: 1.2; }
  .edge-dashed { stroke: #475569; stroke-width: 1; stroke-dasharray: 4 3; }

  .cluster-rect {
    fill: none;
    stroke-dasharray: 5 4;
    rx: 12;
  }
  .cluster-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    fill: #475569;
    text-transform: uppercase;
  }

  .flow-arrow {
    stroke: #10B981;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
  }

  /* Flow pulse animation */
  @keyframes flow-dash {
    to { stroke-dashoffset: -20; }
  }
  .edge-animated {
    stroke-dasharray: 8 5;
    animation: flow-dash 0.6s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .edge-animated { animation: none; }
  }

  /* Node highlight during playback */
  .node-highlight .node-rect {
    filter: brightness(1.3) drop-shadow(0 0 8px rgba(56,189,248,0.5));
  }
  .node-highlight .node-border { opacity: 1; stroke-opacity: 1; }

  /* Hover glow effect */
  .node-group:hover .node-glow {
    opacity: 1;
  }
  .node-glow {
    opacity: 0;
    transition: opacity 0.2s;
  }

  /* Legend */
  #legend {
    position: absolute;
    bottom: 12px;
    left: 14px;
    background: rgba(17,24,39,0.85);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    backdrop-filter: blur(4px);
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 10px;
    color: var(--text-dim);
  }
  .legend-line {
    width: 22px;
    height: 2px;
    border-radius: 1px;
    flex: none;
  }

  /* Tooltip */
  #tooltip {
    position: absolute;
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    color: var(--text-dim);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 100;
    white-space: nowrap;
  }
  #tooltip.show { opacity: 1; }

  /* Step label overlay */
  #step-label {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(17,24,39,0.9);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 5px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 50;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  #step-label.show { opacity: 1; }

  /* Responsive */
  @media (max-width: 680px) {
    #panel { width: 100%; position: absolute; top: 0; right: 0; height: 100%; z-index: 20; }
    #topbar .tag { display: none; }
  }
</style>

<div id="shell">
  <div id="topbar">
    <span class="logo">ECHOSYNC</span>
    <span class="tag">v0.1.0</span>
    <span class="tag">FastAPI · Python 3.11</span>
    <span class="tag">Docker Compose / Caddy · OCI ARM64</span>
    <div class="sep"></div>
    <span class="tag" style="color:var(--flow);border-color:var(--flow)">Runtime Architecture</span>
  </div>

  <div id="workspace">
    <div id="canvas-wrap">
      <div id="canvas">
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="legend">
        <div class="legend-row">
          <div class="legend-line" style="background:var(--flow)"></div>
          Primary voice flow
        </div>
        <div class="legend-row">
          <div class="legend-line" style="background:var(--border)"></div>
          Internal call
        </div>
        <div class="legend-row">
          <div class="legend-line" style="background:var(--muted);height:1px;background:repeating-linear-gradient(to right,var(--muted) 0,var(--muted) 4px,transparent 4px,transparent 7px)"></div>
          Config / startup
        </div>
      </div>
      <div id="tooltip"></div>
      <div id="step-label"></div>
    </div>

    <div id="panel">
      <div id="panel-header">
        <div id="panel-icon"></div>
        <div>
          <div id="panel-title"></div>
          <div id="panel-subtitle"></div>
        </div>
        <button id="panel-close">×</button>
      </div>
      <div id="panel-body"></div>
    </div>
  </div>

  <div id="bottombar">
    <span class="bb-label">FLOW</span>
    <div class="sep-v"></div>
    <div id="step-track"></div>
    <div class="sep-v"></div>
    <button class="zoom-btn" id="zoom-out" title="Zoom out">−</button>
    <button class="zoom-btn" id="zoom-in" title="Zoom in">+</button>
    <button class="zoom-btn" id="zoom-fit" title="Fit view" style="width:auto;padding:0 8px;font-size:10px;font-family:'JetBrains Mono',monospace">FIT</button>
  </div>
</div>

const NODES = [
  {
    id: 'browser',

  {

      desc: 'Stateful LSTM inference per 32ms frame. Emits SILENCE / SPEECH_ACTIVE / SPEECH_END events. On SPEECH_END emits float32 audio buffer to STT. Barge-in only fires during SPEAKING state, not STREAMING_LLM, gated by probability threshold.',
    }

  {

    detail: {

function midpoint(n) {
  return { x: n.x + n.w / 2, y: n.y + n.h / 2 };
}

// Compute a curved path between two nodes
function edgePath(fromNode, toNode) {
  const fx = fromNode.x + fromNode.w;
  const fy = fromNode.y + fromNode.h / 2;
  const tx = toNode.x;
  const ty = toNode.y + toNode.h / 2;

  // Special cases for vertical connections
  const dx = tx - fx;
  const dy = ty - fy;

  if (Math.abs(dy) > Math.abs(dx) * 0.8) {
    // More vertical: route differently
    const fx2 = fromNode.x + fromNode.w / 2;
    const fy2 = (dy > 0) ? fromNode.y + fromNode.h : fromNode.y;
    const tx2 = toNode.x + toNode.w / 2;
    const ty2 = (dy > 0) ? toNode.y : toNode.y + toNode.h;
    const cp = (fy2 + ty2) / 2;
    return `M${fx2},${fy2} C${fx2},${cp} ${tx2},${cp} ${tx2},${ty2}`;
  }

  // Mostly horizontal
  const cp1x = fx + dx * 0.4;
  const cp2x = tx - dx * 0.4;
  return `M${fx},${fy} C${cp1x},${fy} ${cp2x},${ty} ${tx},${ty}`;
}

// Special: return path from TTS/gateway back to browser (arc above)
function returnPath(fromNode, toNode) {
  const fx = fromNode.x + fromNode.w / 2;
  const fy = fromNode.y;
  const tx = toNode.x + toNode.w / 2;
  const ty = toNode.y;
  return `M${fx},${fy} C${fx},${fy - 60} ${tx},${ty - 60} ${tx},${ty}`;
}

const edgeEls = {};

  if (!fromNode || !toNode) return;

  let d;
  if (edge.id === 'gateway-browser-return') {
    d = returnPath(nodeMap['gateway'], nodeMap['browser']);
  } else {
    d = edgePath(fromNode, toNode);
  }

  const g = el('g', { 'data-edge': edge.id }, edgeLayer);

  let strokeColor = '#334155';
  let strokeWidth = '1.2';
  let dashArray = null;
  let markerEnd = 'url(#arrow-secondary)';

  if (edge.type === 'primary') {
    strokeColor = '#10B981';
    strokeWidth = '1.8';
    markerEnd = 'url(#arrow-primary)';
  } else if (edge.type === 'dashed') {
    strokeColor = '#334155';
    strokeWidth = '1';
    dashArray = '4 3';
    markerEnd = 'url(#arrow-dashed)';
  }

  const pathAttrs = {
    d,
    stroke: strokeColor,
    'stroke-width': strokeWidth,
    fill: 'none',
    'stroke-linecap': 'round',
    'marker-end': markerEnd,
  };
  if (dashArray) pathAttrs['stroke-dasharray'] = dashArray;

  const path = el('path', pathAttrs, g);
  edgeEls[edge.id] = { g, path, edge };
});

const canvasWrap = document.getElementById('canvas-wrap');
const canvas = document.getElementById('canvas');
let scale = 1, tx = 0, ty = 0;
let dragging = false, lastX = 0, lastY = 0;

function applyTransform() {
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

function fitView() {
  const cw = canvasWrap.clientWidth;
  const ch = canvasWrap.clientHeight;
  const margin = 32;
  const scaleX = (cw - margin * 2) / SVG_W;
  const scaleY = (ch - margin * 2) / SVG_H;
  scale = Math.min(scaleX, scaleY, 1.2);
  tx = (cw - SVG_W * scale) / 2;
  ty = (ch - SVG_H * scale) / 2;
  applyTransform();
}

canvasWrap.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvasWrap.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx += e.clientX - lastX;
  ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  canvasWrap.classList.remove('panning');
});

canvasWrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvasWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = e.deltaY < 0 ? 1.1 : 0.9;
  const newScale = Math.max(0.3, Math.min(2.5, scale * delta));
  tx = mx - (mx - tx) * (newScale / scale);
  ty = my - (my - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
}, { passive: false });

// Touch
let lastTouchDist = 0;
canvasWrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.hypot(dx, dy);
  }
}, { passive: true });
canvasWrap.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) {
    tx += e.touches[0].clientX - lastX;
    ty += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    applyTransform();
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = dist / lastTouchDist;
    scale = Math.max(0.3, Math.min(2.5, scale * delta));
    lastTouchDist = dist;
    applyTransform();
  }
}, { passive: true });
canvasWrap.addEventListener('touchend', () => { dragging = false; });

document.getElementById('zoom-in').addEventListener('click', () => {
  scale = Math.min(2.5, scale * 1.2); applyTransform();
});
document.getElementById('zoom-out').addEventListener('click', () => {
  scale = Math.max(0.3, scale / 1.2); applyTransform();
});
document.getElementById('zoom-fit').addEventListener('click', fitView);

function openPanel(node) {
  const d = node.detail;
  panelIcon.textContent = node.icon;
  panelIcon.style.background = node.fill;
  panelIcon.style.border = `1px solid ${node.stroke}`;
  panelTitle.textContent = node.label;
  panelSub.textContent = d.role;

  panelBody.innerHTML = '';

  // Description
  const descSec = section();
  lbl('Overview', descSec);
  const p = document.createElement('p');
  p.className = 'p-prose';
  p.textContent = d.desc;
  descSec.appendChild(p);
  panelBody.appendChild(descSec);

  // Files
  if (d.files && d.files.length) {
    const sec = section();
    lbl('Source Files', sec);
    d.files.forEach(f => {
      const div = document.createElement('div');
      div.className = 'p-path';
      div.textContent = f;
      sec.appendChild(div);
    });
    panelBody.appendChild(sec);
  }

  // Tech
  if (d.tech && d.tech.length) {
    const sec = section();
    lbl('Technologies', sec);
    const chips = document.createElement('div');
    chips.className = 'p-chips';
    d.tech.forEach(t => {
      const c = document.createElement('span');
      c.className = 'p-chip';
      const dot = document.createElement('span');
      dot.className = 'dot';
      c.appendChild(dot);
      c.append(t);
      chips.appendChild(c);
    });
    sec.appendChild(chips);
    panelBody.appendChild(sec);
  }

  // Endpoints
  if (d.endpoints && d.endpoints.length) {
    const sec = section();
    lbl('Endpoints', sec);
    d.endpoints.forEach(ep => {
      const c = document.createElement('span');
      c.className = 'p-chip';
      c.style.fontFamily = "'JetBrains Mono', monospace";
      c.style.fontSize = '10px';
      c.textContent = ep;
      sec.appendChild(c);
    });
    panelBody.appendChild(sec);
  }

  // Props
  if (d.props && d.props.length) {
    const sec = section();
    lbl('Config & Parameters', sec);
    const kv = document.createElement('div');
    kv.className = 'p-kv';
    d.props.forEach(row => {
      const r = document.createElement('div');
      r.className = 'p-row';
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = row.k;
      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = row.v;
      r.appendChild(k);
      r.appendChild(v);
      kv.appendChild(r);
    });
    sec.appendChild(kv);
    panelBody.appendChild(sec);
  }

  panel.classList.add('open');
}

function section() {
  const s = document.createElement('div');
  s.className = 'p-section';
  return s;
}
function lbl(text, parent) {
  const l = document.createElement('div');
  l.className = 'p-label';
  l.textContent = text;
  parent.appendChild(l);
}

document.getElementById('panel-close').addEventListener('click', () => {

const tooltip = document.getElementById('tooltip');
function showTooltip(e, text) {
  tooltip.textContent = text;

function posTooltip(e) {
  const rect = canvasWrap.getBoundingClientRect();
  let x = e.clientX - rect.left + 12;
  let y = e.clientY - rect.top - 10;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() { tooltip.classList.remove('show'); }

// ═══════════════════════════════════════════════════════════
//  FLOW PLAYBACK
// ═══════════════════════════════════════════════════════════

const stepLabel = document.getElementById('step-label');
const stepTrack = document.getElementById('step-track');
let activeStep = -1;
let playInterval = null;

// Build step dots
FLOW_STEPS.forEach((step, i) => {
  const dot = document.createElement('div');
  dot.className = 'step-dot';
  dot.title = step.label;
  dot.addEventListener('click', () => goToStep(i));
  stepTrack.appendChild(dot);
});

// Play/pause button
const playBtn = document.createElement('button');
playBtn.className = 'step-btn';
playBtn.textContent = '▶ Play';
playBtn.addEventListener('click', () => {
  if (playInterval) {
    stopPlay();
  } else {
    startPlay();
  }
});

// Prev/next
const prevBtn = document.createElement('button');
prevBtn.className = 'step-btn';
prevBtn.textContent = '← Prev';
prevBtn.addEventListener('click', () => {
  stopPlay();
  goToStep(Math.max(0, activeStep - 1));
});

const nextBtn = document.createElement('button');
nextBtn.className = 'step-btn';
nextBtn.textContent = 'Next →';
nextBtn.addEventListener('click', () => {
  stopPlay();
  goToStep(Math.min(FLOW_STEPS.length - 1, activeStep + 1));
});

// Reset button
const resetBtn = document.createElement('button');
resetBtn.className = 'step-btn';
resetBtn.textContent = '↺ Reset';
resetBtn.addEventListener('click', () => {
  stopPlay();
  clearHighlights();
  activeStep = -1;
  updateDots();
  stepLabel.classList.remove('show');
});

const bottombar = document.getElementById('bottombar');
// Insert buttons after the bb-label + sep-v + track
bottombar.insertBefore(resetBtn, bottombar.children[3]);
bottombar.insertBefore(prevBtn, bottombar.children[3]);
bottombar.insertBefore(nextBtn, bottombar.children[3]);
bottombar.insertBefore(playBtn, bottombar.children[3]);

// Insert another separator
const sepAfterBtns = document.createElement('div');
sepAfterBtns.className = 'sep-v';
bottombar.insertBefore(sepAfterBtns, bottombar.children[7]);

function clearHighlights() {
  Object.values(nodeEls).forEach(g => g.classList.remove('node-highlight'));
  Object.values(edgeEls).forEach(({ path, edge }) => {
    if (edge.type === 'primary') {
      path.removeAttribute('stroke-dasharray');
      path.classList.remove('edge-animated');
    }
  });
}

function goToStep(idx) {
  clearHighlights();
  activeStep = idx;
  const step = FLOW_STEPS[idx];

  // Highlight nodes
  step.nodes.forEach(nid => {
    if (nodeEls[nid]) nodeEls[nid].classList.add('node-highlight');
  });

  // Animate edges
  step.edges.forEach(eid => {
    if (edgeEls[eid]) {
      const { path } = edgeEls[eid];
      path.setAttribute('stroke-dasharray', '8 5');
      path.classList.add('edge-animated');
    }
  });

  // Label
  stepLabel.textContent = step.label;
  stepLabel.classList.add('show');

  updateDots();
}

function updateDots() {
  const dots = stepTrack.querySelectorAll('.step-dot');
  dots.forEach((dot, i) => {
    dot.classList.remove('active', 'done');
    if (i === activeStep) dot.classList.add('active');
    else if (i < activeStep) dot.classList.add('done');
  });
}

function startPlay() {
  if (activeStep < 0) activeStep = -1;
  playBtn.textContent = '⏸ Pause';
  playBtn.classList.add('active');
  playInterval = setInterval(() => {
    const next = activeStep + 1;
    if (next >= FLOW_STEPS.length) {
      stopPlay();
      return;
    }
    goToStep(next);
  }, 1400);
  goToStep(activeStep + 1 < FLOW_STEPS.length ? activeStep + 1 : 0);
}

function stopPlay() {
  clearInterval(playInterval);
  playInterval = null;
  playBtn.textContent = '▶ Play';
  playBtn.classList.remove('active');
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════

window.addEventListener('resize', fitView);
setTimeout(fitView, 60);
</script>
