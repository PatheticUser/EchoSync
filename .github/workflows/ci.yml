name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Tests
    runs-on: ubuntu-latest
    env:
      # Placeholder key satisfies pydantic-settings validation on import;
      # live Gemini tests self-skip when the value starts with "test_".
      GEMINI_API_KEY: test_dummy_for_ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Ruff format
        run: uv run ruff format --check src tests scripts

      - name: Pytest (no-model unit tests)
        # Tests marked requires_models need the local models/ directory which is
        # not committed to the repo.  Skip them on CI; they run locally via
        # `uv run pytest -v` once weights have been downloaded.
        run: uv run pytest -v -m "not requires_models"

  docker:
    name: Docker build & push
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU user-space emulation is required to BUILD the linux/arm64 variant
      # on the amd64 GitHub runner. The app image never runs under emulation:
      # GHCR serves the arm64 variant natively to the Oracle Ampere A1 VM, and
      # local dev pulls the amd64 variant.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        # Multi-arch manifest: amd64 for local dev + arm64/aarch64 for the
        # Oracle Cloud Ampere A1 deployment (docker compose pulls the arm64
        # variant natively — no emulation on the VM).
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max