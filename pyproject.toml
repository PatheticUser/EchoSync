[project]
name = "echosync"
version = "0.1.0"
description = "Low-Latency Edge/Cloud Hybrid Conversational Voice Agent"
readme = "README.md"
authors = [
    { name = "Rameez", email = "rameezalipacific@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.2.8",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.22.0",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.29.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.4",
]

[project.scripts]
echosync = "src.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
